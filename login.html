<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Acesse a PKFSPORT, sua loja de artigos esportivos.">

    <title>PKFSPORT | Login</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <a href="login.html" class="brand login-brand">
                <span class="brand-icon">
                    <i class="bi bi-trophy-fill"></i>
                </span>

                <span class="logo-title">
                    PKF<span>SPORT</span>
                </span>
            </a>

            <h1 id="form-title">Acesse sua conta</h1>

            <p class="login-description" id="form-description">
                Entre para conferir nossa coleção esportiva.
            </p>

            <form id="login-form">

                <div class="form-field">
                    <label for="email">E-mail</label>

                    <div class="input-with-icon">
                        <i class="bi bi-envelope" aria-hidden="true"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Senha</label>

                    <div class="input-with-icon">
                        <i class="bi bi-lock" aria-hidden="true"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            minlength="4"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggle-password"
                            aria-label="Mostrar senha"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div
                    class="form-field hidden"
                    id="confirm-password-area"
                >
                    <label for="confirm-password">
                        Confirmar senha
                    </label>

                    <div class="input-with-icon">
                        <i class="bi bi-lock-fill" aria-hidden="true"></i>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Digite a senha novamente"
                            minlength="4"
                            autocomplete="new-password"
                        >
                    </div>
                </div>

                <p
                    id="login-message"
                    class="message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="login-button"
                    id="submit-button"
                >
                    Entrar
                </button>

            </form>

            <div class="register-area">
                <p id="toggle-text">Ainda não tem conta?</p>

                <button
                    type="button"
                    class="register-button"
                    id="toggle-form"
                >
                    Criar conta
                </button>
            </div>

            <a href="loja.html" class="store-access-button">
                <i class="bi bi-shop"></i>
                Conhecer a loja
            </a>

            <p class="login-help">
                <i class="bi bi-shield-check"></i>
                Ambiente demonstrativo da PKFSPORT.
            </p>

        </section>

    </main>

</body>
</html>
